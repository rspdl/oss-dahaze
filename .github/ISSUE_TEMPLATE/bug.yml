name: 버그 신고
description: 의도와 다르게 동작하는 것을 알립니다
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요
      description: 기대한 동작과 실제 동작을 함께 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 재현에 필요한 최소 단계. RSPDL 소스가 관련되면 전문을 붙여 주세요.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: rspdl-version
    attributes:
      label: RSPDL 버전
      description: "`GET /api/analysis/runtime` 또는 `/health` 응답의 rspdl_version"
      placeholder: "0.1.0"

  - type: dropdown
    id: area
    attributes:
      label: 어디에서 발생했나요
      options:
        - 프론트 (apps/web)
        - API (apps/api)
        - MCP 서버
        - 컴파일 결과·진단
        - 배포·인프라
        - 모르겠음
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: OS와 아키텍처, 브라우저. RSPDL은 x86_64+glibc에서만 설치됩니다.
      placeholder: "macOS 15 arm64 / Chrome 141"
