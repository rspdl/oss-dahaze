[project]
name = "dahaze-api"
version = "0.1.0"
description = "dahaze API — RSPDL authoring and verification workspace"
requires-python = ">=3.12"
dependencies = [
    # --- RSPDL ---
    # 정확한 버전으로 고정한다. RSPDL은 0.x 이고 문법·IR·진단이 minor 릴리스에서 바뀔 수 있다.
    # 이 핀을 올리는 것은 의존성 갱신이 아니라 제품 변경이다.
    # 절차: .agents/skills/upgrade-rspdl/SKILL.md
    "rspdl==0.1.0",

    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.5.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    "pyjwt>=2.10.0",
    "openai>=1.60.0",
    "mcp>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dahaze_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
