# api.dahaze.xyz — 호스트 nginx. Lightsail 인스턴스의 /etc/nginx/sites-available/ 에 놓는다.
#
# 컨테이너는 127.0.0.1 에만 바인딩하므로 바깥에서 들어오는 유일한 길이 여기다.
# TLS 인증서는 certbot 이 관리한다 (infra/prod/DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name api.dahaze.xyz;

    # certbot 갱신용 challenge 만 평문으로 남기고 나머지는 전부 HTTPS 로 보낸다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dahaze.xyz;

    ssl_certificate     /etc/letsencrypt/live/api.dahaze.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dahaze.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 세션 쿠키가 상위 도메인(.dahaze.xyz)으로 공유된다 (ADR-0004). 브라우저가 HTTPS 로만
    # 그 쿠키를 보내도록 강제한다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # RSPDL 소스 문서를 통째로 올린다. 기본 1M 은 충분해 보이지만, 여러 소스를 한 번에
    # 컴파일하는 요청에서 걸릴 수 있다.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # bounded model finding 은 Z3 가 실제로 도는 작업이라 기본 60초로는 부족할 수 있다.
        # 컴파일러 자체 timeout 이 결과를 `unknown` 으로 돌려주므로, 프록시가 먼저 끊으면
        # 사용자는 그 설명을 못 받고 502 만 본다.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8400/mcp;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # MCP 는 Streamable HTTP 다. 응답을 모았다가 보내면 스트리밍이 죽는다.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
