# 인증서가 없는 동안 쓰는 nginx 설정.
#
# 왜 따로 두는가: `api.conf` 는 `ssl_certificate` 를 참조하는데, 그 파일이 없으면 nginx 가
# **뜨지 않는다.** nginx 가 죽어 있으면 80 포트가 닫히고, 그러면 ACME challenge 가 통과하지
# 못해 인증서를 영영 발급받을 수 없다. 부팅과 발급이 서로를 기다리는 교착이다.
#
# 그래서 부팅 직후에는 이 설정으로 80 포트만 열어 두고, 인증서를 받은 뒤
# `issue-cert.sh` 가 `api.conf` 로 갈아 끼운다.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # certbot 이 webroot 모드로 파일을 놓을 자리.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # TLS 가 붙기 전에도 배포와 헬스체크를 확인할 수 있게 프록시는 열어 둔다.
    # 이 상태로 운영하지 않는다 — 세션 쿠키가 평문으로 오간다.
    location / {
        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
